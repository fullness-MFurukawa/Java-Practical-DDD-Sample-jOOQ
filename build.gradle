plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'nu.studer.jooq' version '9.0'
}

group = 'jp.co.fullness.ddd'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-jooq-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	
	// MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testAnnotationProcessor "org.mapstruct:mapstruct-processor:1.6.3"
	// 生成時にDBへ接続するためのドライバ
	jooqGenerator 'org.postgresql:postgresql'
    // Open API(Swagger)
    //implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.8.12'
    // Swagger UI 同梱。Spring Boot 4（Spring Framework 7）対応版。
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'   
}

tasks.named('test') {
	useJUnitPlatform()
}

jooq {
    version = dependencyManagement.importedProperties['jooq.version']
    configurations {
        main {
            generateSchemaSourceOnCompilation = false
            generationTool {
                jdbc {
                    driver = 'org.postgresql.Driver'
                    url = 'jdbc:postgresql://localhost:5432/restapi_exercise'
                    user = 'postgres'
                    password = 'training'
                }
                generator {
                    name = 'org.jooq.codegen.JavaGenerator'
                    database {
                        name = 'org.jooq.meta.postgres.PostgresDatabase'
                        inputSchema = 'public'
                        includes = 'product|product_category|product_stock'
                    }
                    generate {
                        records = true
                        pojos = false
                        deprecated = false
                    }
                    target {
                        packageName = 'jp.co.fullness.ddd.infrastructure.jooq.generated'
                        directory   = 'src/generated/jooq'                       }
                }
            }
        }
    }
}

// jooq ブロックの外。生成物をコンパイル対象に含める
sourceSets {
    main {
        java {
            srcDir 'src/generated/jooq'
        }
    }
}

javadoc {
    // --- 文字コード（日本語対応。3つとも UTF-8 に揃えるのが要点）---
    options.encoding    = 'UTF-8'   // ソース(.java)の読み込みエンコーディング
    options.charSet     = 'UTF-8'   // 生成HTMLの <meta charset>
    options.docEncoding = 'UTF-8'   // 生成HTMLの書き出しエンコーディング

    // --- 見た目・範囲 ---
    title = '商品管理API (jOOQ版) — ドメイン駆動設計 実践サンプル'
    options.locale = 'ja_JP'                 // 生成UIの言語（"パッケージ" 等の見出しを日本語に）
    options.memberLevel = JavadocMemberLevel.PROTECTED  // public/protected を対象（private は除外）
    options.addBooleanOption('author', true) // @author を出力
    options.addBooleanOption('version', true)// @version / @since を出力

    // --- doclint 無効化（@param 等の不足でビルドを止めない）---
    options.addStringOption('Xdoclint:none', '-quiet')

    // --- 外部 JavaDoc へのリンク（型名からリンクを張る）---
    options.links(
        'https://docs.oracle.com/en/java/javase/21/docs/api/'
    )

    // --- jOOQ のコード生成物は対象外（自動生成のためコメント無し）---
    exclude 'jp/co/fullness/ddd/infrastructure/jooq/generated/**'

    // 警告を減らしたい場合（任意）
    options.addStringOption('quiet')
}