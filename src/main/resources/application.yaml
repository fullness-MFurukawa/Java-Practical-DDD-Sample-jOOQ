spring:
  application:
    name: practical_sample_jooq
  datasource:
    url: jdbc:postgresql://localhost:5432/restapi_exercise
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:training}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ddd-demo-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000   # ミリ秒

